name: Build HTML to Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Cordova and Build APK
      run: |
        npm install -g cordova
        cordova create ucup-android-app com.ucup.game "UcupGame"
        cp -r index.html docs/ welcome\ and\ gamemods/ README.md ucup-android-app/www/ 2>/dev/null || cp index.html ucup-android-app/www/
        cd ucup-android-app
        cordova platform add android
        cordova build android --device --release

    - name: Simpan APK ke Halaman Actions (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: UcupGame-Android-APK
        path: |
          **/*.apk
