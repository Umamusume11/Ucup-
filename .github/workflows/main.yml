name: Build Game for Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # === JOB 1: MERAKIT GAME UNTUK WINDOWS (.EXE) ===
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Nativefier
      run: npm install -g nativefier

    - name: Convert HTML to EXE
      run: nativefier --name "MyHTMLGame" --platform "windows" --arch "x64" . output/

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-exe
        path: output/**/*

  # === JOB 2: MERAKIT GAME UNTUK HP ANDROID (.APK) ===
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK Alat Build
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap (Pembungkus Web ke APK Resmi)
      run: |
        npm install -g @bubblewrap/cli
        # Membuat proyek Android instan dari game web Anda
        bubblewrap init --manifest=https://githubusercontent.com --meta --force || true
        mkdir -p android-output
        
        # Menggunakan template compiler dasar Gradle yang pasti menghasilkan APK debug
        echo "plugins { id 'com.android.application' }" > build.gradle
        echo "android { compileSdk 34; defaultConfig { applicationId 'com.ucup.game'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } }" >> build.gradle
        mkdir -p src/main/assets/www
        cp -r index.html docs/ welcome\ and\ gamemods/ README.md src/main/assets/www/ 2>/dev/null || cp index.html src/main/assets/www/
        
        # Buat wrapper gradle otomatis
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/*.apk android-output/ 2>/dev/null || cp build/outputs/apk/debug/*.apk android-output/ 2>/dev/null || find . -name "*.apk" -exec cp {} android-output/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-android-apk
        path: android-output/*.apk

