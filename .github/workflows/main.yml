name: Build Game for Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # === JOB 1: WINDOWS .EXE (91 MB - SUKSES) ===
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Nativefier
      run: npm install -g nativefier

    - name: Convert HTML to EXE
      run: nativefier --name "MyHTMLGame" --platform "windows" --arch "x64" . output/

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-exe
        path: output/**/*

  # === JOB 2: ANDROID .APK ASLI (UKURAN MB & BISA DIINSTAL) ===
  build-android:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lldb lld libssl-dev libffi-dev autoconf automake libtool pkg-config zlib1g-dev

    - name: Build Android APK via Buildozer
      uses: ArtemGovorov/buildozer-action@v1
      with:
        workdir: .
        command: buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-android-apk
        path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/outputs/apk/debug/*.apk
