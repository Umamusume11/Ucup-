name: Build Game for Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # === JOB 1: WINDOWS .EXE ===
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Nativefier
      run: npm install -g nativefier

    - name: Convert HTML to EXE
      run: nativefier --name "MyHTMLGame" --platform "windows" --arch "x64" . output/

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-exe
        path: output/**/*

  # === JOB 2: ANDROID .APK ASLI (DENGAN ENGINE ANDROID RESMI) ===
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Pasang Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Merakit APK Android Asli Lewat Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init UcupGame com.ucup.game --web-dir=.
        npm install @capacitor/android
        npx cap add android
        
        # Sinkronisasi aset game HTML Anda ke dalam folder Android asli
        npx cap sync android
        
        # Masuk ke folder Android dan kompilasi menggunakan Gradle resmi Google
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Pindahkan file APK asli yang sudah jadi ke folder luar
        mkdir -p ../android-output
        cp app/build/outputs/apk/debug/app-debug.apk ../android-output/UcupGame.apk

    - name: Upload APK Artifact Resmi
      uses: actions/upload-artifact@v4
      with:
        name: game-android-apk
        path: android-output/UcupGame.apk

