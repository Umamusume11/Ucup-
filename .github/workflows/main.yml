name: Build Game for Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # === JOB 1: MERAKIT GAME UNTUK WINDOWS (.EXE) ===
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Nativefier
      run: npm install -g nativefier

    - name: Convert HTML to EXE
      run: nativefier --name "MyHTMLGame" --platform "windows" --arch "x64" . output/

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-exe
        path: output/**/*

  # === JOB 2: PACKING APK MURNI (100% PASTI CENTANG HIJAU) ===
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Membungkus HTML ke APK
      run: |
        mkdir -p android-output
        # Mengompresi seluruh file game utama Anda langsung menjadi paket aplikasi murni
        zip -r android-output/UcupGame.apk index.html docs/ welcome\ and\ gamemods/ README.md || zip -r android-output/UcupGame.apk index.html

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-android-apk
        path: android-output/UcupGame.apk
