name: Build HTML Game to EXE with .NET 10 Support

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Memasang .NET 10 SDK ke dalam server Windows Runner GitHub
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Mengunci lingkungan ke versi .NET 10 terbaru

    # 2. Menyiapkan Node.js untuk kebutuhan pembungkusan aplikasi
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3. Memasang Nativefier untuk mengubah web menjadi aplikasi desktop
    - name: Install Nativefier
      run: npm install -g nativefier

    # 4. Proses konversi game HTML menjadi aplikasi desktop EXE Windows
    - name: Convert HTML to EXE
      run: |
        nativefier --name "MyHTMLGame" --platform "windows" --arch "x64" . output/

    # 5. Mengunggah hasil jadi file EXE game ke halaman Actions Artifacts
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-exe
        path: output/**/* # Menjamin seluruh file hasil build di dalam folder output terunggah
